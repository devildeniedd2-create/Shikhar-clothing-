<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIKHAR — Peak of Indian Fashion</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0b0b0b;
  color: #fff;
  font-family: 'Inter', sans-serif;
}

/* NAVBAR */
nav {
  position: absolute;
  width: 100%;
  padding: 25px 50px;
  display: flex;
  justify-content: space-between;
  z-index: 10;
}

nav h1 {
  font-family: 'Playfair Display', serif;
  letter-spacing: 4px;
}

/* HERO */
.hero {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.hero-content {
  position: relative;
  text-align: center;
}

.hero-content h1 {
  font-size: 70px;
  letter-spacing: 8px;
  font-family: 'Playfair Display', serif;
}

.hero-content p {
  letter-spacing: 5px;
  font-size: 12px;
  margin-top: 10px;
}

.hero-content button {
  margin-top: 25px;
  padding: 12px 35px;
  background: white;
  color: black;
  border: none;
  cursor: pointer;
}

/* SECTION */
.section {
  padding: 100px 50px;
  text-align: center;
}

.section h2 {
  font-size: 42px;
  font-family: 'Playfair Display', serif;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
  margin-top: 40px;
}

.card {
  background: #111;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 320px;
  object-fit: cover;
}

.card p {
  padding: 12px;
}

/* CULTURE STRIP */
.strip {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  margin-top: 30px;
}

.strip img {
  height: 220px;
  width: 320px;
  object-fit: cover;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 50px;
  background: #000;
  font-size: 14px;
}

html {
  scroll-behavior: smooth;
}

</style>
</head>

<body>

<nav>
  <h1>SHIKHAR</h1>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>SHIKHAR</h1>
    <p>S H I K H A R</p>
    <button>EXPLORE COLLECTION</button>
  </div>
</section>

<!-- BRAND -->
<section class="section">
  <h2>THE PEAK OF IDENTITY</h2>
  <p>Inspired by the Himalayas. Designed for those who rise above.</p>
</section>

<!-- COLLECTION -->
<section class="section">
  <h2>COLLECTION</h2>

  <div class="grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c">
      <p>Kanjivaram Saree</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1593032465171-8c7f64d2f1d3">
      <p>Kids Ethnic Wear</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
      <p>Modern Fusion</p>
    </div>

  </div>
</section>

<!-- INDIA STRIP -->
<section class="section">
  <h2>INDIA. ELEVATED.</h2>

  <div class="strip">
    <img src="https://images.unsplash.com/photo-1587474260584-136574528ed5">
    <img src="https://images.unsplash.com/photo-1595815771614-ade9d652a65d">
    <img src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944">
    <img src="https://images.unsplash.com/photo-1580655653885-65763b2597d0">
    <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523">
  </div>
</section>

<footer>
  <p>© 2026 SHIKHAR — Peak of Indian Luxury</p>
</footer>

</body>
</html>
